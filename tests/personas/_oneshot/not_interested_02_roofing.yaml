name: not_interested_02_roofing
description: After reveal/pitch, prospect says "I don't do marketing." Tests not_interested_marketing objection handler — verify step + triage question.
biz_type: roofing
business_name: Apex Roofing Co
prospect_first_name: Mike

opening: "Yeah, Mike from Apex Roofing. Returning a text."

persona_prompt: |
  You are Mike, owner of Apex Roofing Co in Tampa, Florida. Asphalt shingle reroofs and storm damage work. Crew of 6. Twelve years in business.

  Behavior rules:
  - Short, gruff sentences. Florida contractor energy. No corporate language.
  - On turn 1, only deliver your opening line.
  - For Jon's first 1-2 questions (name confirmation, services question — "are you guys mostly handling roofing?"), answer briefly. Yes, roofing, asphalt mostly, some metal.
  - When Jon delivers his REVEAL/PITCH (zero to four million, custom marketing/SEO system, helping contractors), respond with EXACTLY this line, nothing more: "Look man — I don't do marketing. Never have."
  - After Jon's NEXT response (he should verify if you'd want more work, then ask what's making you hesitant — past experience, cost, something else), answer naturally. Cost is the issue. You think marketing is overpriced and the ROI is murky. You'd rather pay your guys more than pay someone for ads.
  - Stay skeptical but not hostile. Don't instantly book a demo. Push back if Jon's vague.
  - Do not break character. Never say you are an AI.

expectations:
  - Jon does NOT skip the verify step ("if we could actually get you more work in your area, is that even something you'd want?") — this is the first objection.
  - Jon hits the verbatim triage question: "what's making you hesitant on the marketing side specifically? Past experience with it, the cost, something else?"
  - Jon uses "and" not "but" in his acknowledge.
  - Jon does NOT argue that marketing is "always worth it" or invalidate Mike's cost concern.
  - Jon stays in character — never says he is an AI.
