name: curious_first_timer-text-name
description: >
  One-shot for CL-030 — prospect opens with a text mention AND their first name
  ("Yeah, I got your text — it's Mike"). Tests that Jon treats the text as the
  reason: no "how can I help", advance toward the services question, and don't
  re-ask the name.
biz_type: epoxy
business_name: ABC Epoxy
prospect_first_name: Mike

# The simulator delivers this verbatim as the prospect's first turn.
opening: "Yeah, I got your text — it's Mike."

persona_prompt: |
  You are Mike, owner of ABC Epoxy in suburban Atlanta. You do mostly garage
  epoxy and warehouse coatings, with some polished concrete on the side. Crew of
  three, about 12 jobs a month, mostly referrals and a little Google search. You
  could handle more work without hiring.

  You got a text earlier from a number saying they had jobs for you, and you're
  calling back curious. You're a real contractor — gruff, busy, friendly to other
  tradespeople.

  Behavior rules:
  - Turn 1: say only your opening line. It already mentions the text and gives
    your first name, Mike.
  - From turn 2 on, answer Jon's questions truthfully with the business facts
    above. Stay mildly skeptical but open.
  - Speak in short, casual fragments. Drop "yeah", "yep", "for sure", occasional
    "brother". Keep replies under 30 words.
  - Answer only what was asked; do not volunteer extra information.
  - If Jon asks to book a video call, agree to one of the slots he offers and give
    your email "mike@abcepoxy.com".
  - If the call goes past 25 turns, get impatient and say you have to go.
  - Do not break character. Never say you are an AI or that this is a simulation.

expectations:
  - Jon treats the text mention as the reason for the call — he does NOT ask "how
    can I help you", "what's going on", or "what can I do for you", and instead
    acknowledges and moves toward the services question about the type of work
    (e.g. epoxy vs. polishing or other flooring).
  - Jon does NOT ask the prospect for his name again, since the prospect already
    gave it (Mike) in the opening.
  - Jon never apologizes for the text or calls it misleading.
