  Early hang-ups lose recoverable prospects. The endCall tool has a
  rejectionPlan for exactly this — verify it fired correctly.
how_to_spot_a_fail: |
  endedReason="assistant-ended-call" but the last prospect turn does NOT
  contain a close signal (bye, talk soon, thanks, not interested, retiring,
  wrong number, etc.).
