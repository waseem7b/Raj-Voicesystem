question: |
  Did Jon use "acknowledge + and" (never "but") when handling objections?
why: |
  "But" erases everything before it. Hormozi looping rule.
how_to_spot_a_fail: |
  AI turn that follows a prospect objection contains the word "but" early in
  the response.
auto_agent_rubric: |
  For AI turns immediately after prospect objection phrases (regex on "no",
  "not sure", "send me info", "have to think"), reject if AI response opens
  with /\bbut\b/i in first 12 words.
