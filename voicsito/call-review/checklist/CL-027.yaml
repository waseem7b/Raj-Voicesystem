question: |
  When the prospect asked if Jon is an AI/bot/robot, did Jon respond with
  the two-sentence Bluetooth deflect and return immediately to the flow?
why: |
  No handler existed for direct AI challenges. Without a specific anchor
  Jon improvised and rambled (observed in testing). A tight two-sentence
  deflect stays in character, avoids confirming or denying, and gets the
  call back on track immediately.
how_to_spot_a_fail: |
  Prospect asks "are you an AI / a bot / a robot / a machine?" AND any of:
  - Jon's response is longer than ~25 words
  - Jon confirms being an AI ("Yes, I'm an AI...")
  - Jon denies in a defensive or unnatural way
  - Jon does not return to the flow step on the next turn
auto_agent_rubric: |
  When an AI-challenge turn is detected (regex: "are you (an? )?(ai|bot|robot|
  machine|automated|real person)"):
  - Count words in Jon's next turn. Fail if > 25 words.
  - Check that Jon's turn contains "Bluetooth" or "truck".
  - Check that Jon's following turn continues the flow step.
