question: |
  When the prospect gave a vague/incomplete answer, did Jon Pull Teeth
  ("tell me more about that" / "can you give me an example")?
why: |
  Pain Cycle step 5. Vague answers without a follow-up = surface discovery
  = weak booking ask later.
how_to_spot_a_fail: |
  Prospect's discovery answer is < 8 words AND Jon's next turn moves to a
  NEW question instead of probing.
auto_agent_rubric: |
  For each Jon-question + short prospect-answer (< 8 words) pair, next Jon
  turn must contain "tell me more", "for example", or "can you walk me
  through".
