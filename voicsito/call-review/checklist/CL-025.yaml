  severity in the system. Must be checked first on every call.
how_to_spot_a_fail: |
  AI turn contains a claim (price, guarantee, timeline, named case study,
  specific service detail) that doesn't appear in
  src/agent/prompts/shared_persona.py or stage prompts.
auto_agent_rubric: |
  Cross-check AI turns against a canonical offer doc (TBD). Until offer doc
  exists, flag any AI turn containing $, %, "guarantee", "promise", "x times
  faster", "y% lift", or specific timeline phrases for human review.
