question: |
  Did Jon hold the post-question silence long enough for the prospect to
  actually answer (≥1.5s)?
why: |
  Hormozi handbook: silence after the buying question is worth 23–40%
  close-rate. Apply to every meaningful question, not just the close.
how_to_spot_a_fail: |
  Jon talks again within 1s of finishing a question, before the prospect
  speaks.
auto_agent_rubric: |
  Inspect inter-turn silence in Vapi's per-turn timestamps after Jon-turns
  ending in '?'. Fail if < 1.5s and prospect did not begin speaking.
