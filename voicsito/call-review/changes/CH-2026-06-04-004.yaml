hypothesis: |
  Follow-up to CH-2026-06-04-002. A 3-run sim (one-shot
  curious_first_timer-text-name, opener "Yeah, I got your text — it's Mike")
  showed Jon re-asks "how can I help you?" on 3/3 runs when the prospect gives
  their NAME and a TEXT MENTION in the same opening utterance. Root cause: the
  follow-up table branch "Name only, or name + business, but no reason given ->
  how can I help you" overlaps with "Name AND a reason (text...) -> advance"
  when the model does not register the text as the reason; with a name present
  it falls into the "how can I help" branch. The clarifying bullet from
  CH-2026-06-04-002 stated the concept but did not disambiguate the branch the
  model actually selects.
  Fix: add "and no text mention" to the "how can I help" branch condition so a
  name + text utterance no longer matches it and instead routes to the
  "reason -> advance" branch. Condition-only edit (the cond of a branch, not
  any spoken wording) — no anchor words changed. Resolves the ambiguity at the
  branch (prompt-update-discipline principle 1: exception baked into the rule).
  Expected: text+name opener advances to Step 2 with no "how can I help"; the
  text-no-name case (asks name once) and the bare-business-name case (asks how
  can I help) are unaffected, since neither matches the new exclusion.
expected_outcome:
