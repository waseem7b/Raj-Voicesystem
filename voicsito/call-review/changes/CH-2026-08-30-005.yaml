hypothesis: |
  Owner ruled out SSML break tags for this model. ElevenLabs documents em dashes
  as working but explicitly "less consistent than break tags", and never
  documents a RUN of consecutive em dashes -- the documented multi-dash form is
  `-- --` (spaced hyphen pairs). On call 01a05619 (v73, four em dashes at
  sentence ends) two of four markers were silent and produced the intended beat,
  while two were vocalised as "I" and "Well," -- consistent with a four-glyph
  em-dash run being an out-of-distribution token the TTS attempts to pronounce.
  Hypothesis: the documented `-- --` form is in-distribution and stays silent at
  all four positions while still producing the beat.
  Note the handoff records plain `----` (four consecutive hyphens, unspaced) as
  "silent -- swallowed, no pause and no harm". `-- --` is a different string and
  is the form the vendor documents; if it also swallows silently, the marker
  approach is exhausted and the next lever is chunkPlan.minCharacters.

