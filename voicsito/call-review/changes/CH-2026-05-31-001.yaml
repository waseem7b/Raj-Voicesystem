hypothesis: |
  The "I'm just driving right now so I might cut out here and there" caveat
  is baked into the Step 1 anchor, but Step 1 can span more than one turn
  (greeting-only -> ask name; name-only -> ask how you can help; name still
  missing -> re-ask). With no rule scoping the caveat to the opening
  utterance, GPT-4.1 re-renders it on each Step 1 turn, so Jon repeats it.
  Adding an explicit one-time-delivery rule confines the caveat to the
  first utterance. Structural only — no change to the caveat wording.
  Expected effect: caveat appears at most once per call; opener sounds less
  scripted/forgetful.
