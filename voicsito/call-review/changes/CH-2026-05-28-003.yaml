before: |
  **Anchor — default to the standard acknowledgment; swap only on a spoken text reference:**

  - Default: "Yeah, appreciate you calling [first name if known]. I'm just driving right now so I might cut out here and there."
  - Exception — only when the prospect's OWN WORDS this turn mention the text or message we sent: "Yeah, thanks for getting back to me [first name if known]. I'm just driving right now so I might cut out here and there."

  (closing) Use "thanks for getting back to me" only when they themselves bring up the text out loud.

  Follow-up table row:
  | Name only (or name + business), no reason given | Ask what they need — e.g. "...so how can I help you?" |
after: |
  **Anchor — default to the standard acknowledgment; swap when they reference the text or name their business:**

  - Default: "Yeah, appreciate you calling [first name if known]. I'm just driving right now so I might cut out here and there."
  - Exception — when the prospect's OWN WORDS this turn either (a) mention the text or message we sent, OR (b) name their business (e.g. "this is Mike from ABC Epoxy"): "Yeah, thanks for getting back to me [first name if known]. I'm just driving right now so I might cut out here and there."

  (closing) Use "thanks for getting back to me" only when they themselves bring up the text or their business out loud. If they give just a name or a bare greeting with neither, use the default.

  Follow-up table row (per operator override — see hypothesis UPDATE):
  | Name only (or name + business), no reason given | Ask what they need — e.g. "...so how can I help you?" |
