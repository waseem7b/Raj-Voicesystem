hypothesis: |
  Operator (2026-06-09): when a caller names their business or says what they
  do, Jon should acknowledge briefly (in his own words) and move into the flow
  — not re-ask "how can I help". The 2026-06-04 design (CL-030) deliberately
  treated a bare business name as NOT a reason and routed it to "how can I
  help"; on real calls that reads as Jon not listening to a contractor who
  just told him who they are. This reverses that branch: a business name or a
  stated trade now counts as established context -> advance to Step 2 (grab the
  name first if still missing). Only a bare name with zero context still routes
  to "how can I help". Structure-only — no locked anchor wording changed; the
  "...so how can I help you?" phrase is preserved for the narrowed branch.
expected_outcome:
  metric: opener_robot_tell_rate
  direction: down
  magnitude: moderate
  verify_after_n_calls: 10
before: |
  Follow-up table:
    - Name only, or name + business, but no reason and no text mention given
      -> append "...so how can I help you?"
    - Name AND a reason (text / jobs / marketing / work) -> acknowledge ...,
      then stop; Step 2 is your next turn
  What counts as a "reason" — and what doesn't:
    - A bare business name is NOT a reason — you still don't know why they
      called, so ask how you can help.
after: |
  Follow-up table:
    - Name only, with no reason, no text mention, and no business or trade
      given -> append "...so how can I help you?"
    - Name AND any call context (text / jobs / marketing / work / their
      business name / the trade they do) -> acknowledge what they gave you in a
      few words, then stop; Step 2 is your next turn
  What counts as context to move forward:
    - A business name or the trade they do (e.g. "from ABC Epoxy", "I do
      roofing") IS enough context to move forward. Don't re-ask how you can
      help; treat it as established and advance to Step 2. If their name is
      still missing, get it first, then advance.
