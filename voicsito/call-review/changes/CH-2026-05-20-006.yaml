hypothesis: |
  Removing "how can I help you?" from Step 1 and acknowledging the
  text-callback context proactively will reduce the bot-feel on the first
  agent turn. Prospects who text us back already know why they called;
  asking them is a robot tell. Expected effect: smoother first 30s,
  higher Stage 1 → Stage 2 handoff rate, fewer early hang-ups during
  the reveal because Jon sounded "with it" from the jump.
expected_outcome:
  metric: stage1_to_stage2_handoff_rate
  direction: up
  magnitude: small to moderate
  verify_after_n_calls: 10
before: |
  **Anchor:** "Yeah, thanks for the call [first name if known]. I'm just
  driving right now so I might cut out here and there, but..."

  | What the prospect gave you | Continue the utterance with |
  |---|---|
  | Greeting only (no name, no reason) | "Sorry, I didn't catch your name? And how can I help you?" |
  | Name only (no reason) | "How can I help you?" |
  | Reason only (no name) | "Sorry, I didn't catch your name?" |
  | Name AND a reason (text / jobs / marketing / work) | Acknowledge their reason briefly, then stop. Step 2 is your next turn. |

  **Gate:** Advance to Step 2 once you have BOTH their first name AND
  a reason for the call. A vague greeting is not a reason. If either is
  still missing after this turn, ask the missing piece on your next
  turn before moving to Step 2.
after: |
  **Anchor:** "Yeah, appreciate you calling [first name if known]. I'm just
  driving right now so I might cut out here and there."

  | What the prospect gave you | Continue the utterance with |
  |---|---|
  | Greeting only (no name, no reason) | "...sorry, I didn't catch your name?" |
  | Name only (or name + business) | Nothing — stop after the anchor. Step 2 is your next turn. |
  | Reason only (no name) | "...sorry, I didn't catch your name?" |
  | Name AND a reason (text / jobs / marketing / work) | Acknowledge their reason briefly, then stop. Step 2 is your next turn. |

  **Gate:** Advance to Step 2 once you have their first name. The reason
  is implicit — they're calling back about the text we sent. If the
  first name is still missing after this turn, ask for it on your
  next turn before advancing.
