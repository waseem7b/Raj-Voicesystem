hypothesis: |
  The Step 1 acknowledgment branch already swaps to "thanks for getting back
  to me" on EITHER a text mention OR a business name, and the follow-up table
  already routes text (= reason) toward Step 2 and a bare business name (no
  reason) to "how can I help you". But because the acknowledgment groups the
  two triggers together, GPT-4.1 can over-generalize and treat a bare business
  name as if it were a reason (skipping "how can I help you"), or redundantly
  re-ask the reason after a clear text reference. Operator wants a text mention
  (any variant of the word) used as the established reason that keeps the call
  moving toward the reveal, while a bare business name still gets "how can I
  help you". Fix adds one explicit bullet pair under the follow-up table naming
  the distinction. Structural / clarifying only -- no anchor wording changed,
  the "thanks for getting back to me" line and the Step 2/reveal anchors are
  untouched. Honors "keep Step 2" (advance to Step 2, do not skip it) and
  "name first" (grab the name before advancing if still missing).
  Expected effect: on a text mention Jon stops re-asking why and rolls to
  Step 2; on a bare business name Jon still asks how he can help.
expected_outcome:
  metric: opener_reason_misclassification_rate
  direction: down
  magnitude: medium
  verify_after_n_calls: 10
before: |
  - Name AND a reason (text / jobs / marketing / work) -> acknowledge their
    reason in a few words, then stop; Step 2 is your next turn

  Example, name only: ...
after: |
  - Name AND a reason (text / jobs / marketing / work) -> acknowledge their
    reason in a few words, then stop; Step 2 is your next turn

  **What counts as a "reason" — and what doesn't:**

  - A text mention (or any version of that word — "your text", "you texted
    me", "the message about jobs") IS the reason they called. Don't re-ask
    why; treat it as established and advance to Step 2. If their name is still
    missing, get it first, then advance.
  - A bare business name is NOT a reason — you still don't know why they
    called, so ask how you can help.

  Example, name only: ...
