hypothesis: |
  The "Give me a second, let me see what I have available." stall is baked
  into the Step 2 calendar anchor as the verbal cover for get_available_slots
  latency. With no rule scoping the stall to that one line, GPT-4.1 re-renders
  "give me a second / give me a sec" on later booking turns (email capture,
  booking confirmation, logistics) where the tool fires silently and there is
  nothing to cover. Operator reports Jon "constantly" stalling after Step 2.
  Same failure mode as the driving-caveat leak (CH-2026-05-31-001): a phrase
  scoped to one step bleeding into every later step. Fix tightens the existing
  "Silent tool use" rule to confine the stall to the Step 2 calendar line and
  names the leaked variants as off-limits on Steps 4-7. Structural / scoping
  only — the Step 2 anchor wording is unchanged.
  Expected effect: the stall appears at most once per call (Step 2); the close
  feels faster and less scripted from email capture onward.
expected_outcome:
  metric: closing_stall_repeat_rate
  direction: down
  magnitude: large
  verify_after_n_calls: 10
before: |
  **Silent tool use:** Never say the words "function", "tool", or any tool
  name. The only spoken lookup line is the Step 2 calendar line; every other
  tool fires silently while you keep talking, and the natural pause covers the
  latency.
after: |
  **Silent tool use:** Never say the words "function", "tool", or any tool
  name. The only spoken lookup line is the Step 2 calendar line ("Give me a
  second, let me see what I have available."); the "give me a second" stall
  belongs to that line and nowhere else. On Step 4 (email), Step 5 (booking),
  Step 6 (logistics), and Step 7 (sign off), the tool fires silently while you
  keep talking — go straight to that step's line with no "give me a second",
  "give me a sec", "hold on", or "one sec". The natural pause covers any
  latency.
